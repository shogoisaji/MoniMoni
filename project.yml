name: MoniMoni
options:
  bundleIdPrefix: com.isaji134
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

targets:
  MoniMoni:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: MoniMoni
        excludes:
          - "**/*.h"
          - Info.plist
          - MoniMoni.entitlements
          - Assets.xcassets
          - MoniMoniIcon.icon
          - "MoniMoniIcon.icon/**"
    resources:
      - path: MoniMoni/Assets.xcassets
      - path: MoniMoni/MoniMoniIcon.icon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.isaji134.MoniMoni
        PRODUCT_NAME: "$(TARGET_NAME)"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: MoniMoni/Info.plist
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        CODE_SIGN_ENTITLEMENTS: MoniMoni/MoniMoni.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: MoniMoniIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_OBJC_BRIDGING_HEADER: MoniMoni/MoniMoni-Bridging-Header.h
        SWIFT_EMIT_LOC_STRINGS: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"

  MoniMoniTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: MoniMoniTests
    dependencies:
      - target: MoniMoni
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.isaji134.MoniMoniTests
        PRODUCT_NAME: "$(TARGET_NAME)"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MoniMoni.app/Contents/MacOS/MoniMoni"

schemes:
  MoniMoni:
    build:
      targets:
        MoniMoni: all
        MoniMoniTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - MoniMoniTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
